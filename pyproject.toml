[project]
name = "qq-deepseek-setup"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "Pillow>=11,<13",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[project.scripts]
qq-deepseek-setup = "qq_deepseek_setup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qq_deepseek_setup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
